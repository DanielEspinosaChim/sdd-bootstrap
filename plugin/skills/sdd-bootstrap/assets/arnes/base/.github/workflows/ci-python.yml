# CI: lo que define si un PR puede entrar a main.
# Marca este workflow como "required status check" en Settings → Branches → main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # diff-cover compara contra main
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras --dev
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tipos
        run: uv run mypy src/
      - name: Tests (incluye contrato y seguridad de cada endpoint si hay API)
        run: uv run --with pytest-cov pytest -q --cov=src --cov-report=xml
      - name: Todo código nuevo tiene tests (cobertura del diff ≥ 90 %)
        if: github.event_name == 'pull_request'
        run: uvx diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=90
      - name: Cada criterio de aceptación tiene su test (trazabilidad spec → test)
        run: |
          python3 scripts/trazabilidad.py --check --escribir
          git diff --exit-code docs/trazabilidad.md || { echo "docs/trazabilidad.md está desactualizado: corre python3 scripts/trazabilidad.py --escribir y commitea"; exit 1; }
      - name: Documentación de la API al día (OpenAPI)
        if: hashFiles('scripts/exportar_openapi.py') != ''
        run: |
          uv run python scripts/exportar_openapi.py
          git diff --exit-code docs/api/openapi.json || { echo "docs/api/openapi.json está desactualizado: corre uv run python scripts/exportar_openapi.py y commitea"; exit 1; }
      - name: Dependencias con vulnerabilidades conocidas
        run: uvx pip-audit

  secretos:
    name: Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: Código vulnerable (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
      - run: semgrep scan --config p/python --config p/secrets --config p/owasp-top-ten --error

  dependencias:
    name: Dependencias e imagen (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
